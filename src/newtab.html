<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab · Nova</title>
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <!-- Animated aurora / glow layers (pure CSS, no image deps) -->
    <div class="aurora" aria-hidden="true">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <div class="grid"></div>
    </div>

    <main class="stage">
      <header class="brand">
        <div class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <defs>
              <linearGradient id="nv" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#7c5cff" />
                <stop offset="55%" stop-color="#37a6ff" />
                <stop offset="100%" stop-color="#2cd4ff" />
              </linearGradient>
            </defs>
            <path
              d="M8 40 L8 8 L16 8 L32 28 L32 8 L40 8 L40 40 L32 40 L16 20 L16 40 Z"
              fill="url(#nv)"
            />
          </svg>
        </div>
        <div class="wordmark">
          <div class="name">Nova</div>
          <div class="tag">Fast · Quiet · Yours</div>
        </div>
        <div class="clock" id="clock">--:--</div>
      </header>

      <section class="hero">
        <h1 class="greeting" id="greeting">Welcome back</h1>
        <p class="sub">Search the web or jump straight to a site below.</p>

        <form class="search" id="search">
          <svg class="s-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7" />
            <path d="M21 21l-4.3-4.3" />
          </svg>
          <input
            id="q"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search with Google, or paste a link…"
            autofocus
          />
          <button type="submit" class="go" aria-label="Go">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14" />
              <path d="M13 6l6 6-6 6" />
            </svg>
          </button>
        </form>
      </section>

      <section class="tiles" aria-label="Quick access">
        <a class="tile" href="https://www.google.com/" style="--c1:#4285F4;--c2:#34A853">
          <div class="tile-icon">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M21.35 11.1H12v3.2h5.35c-.26 1.4-1.86 4.1-5.35 4.1-3.22 0-5.85-2.67-5.85-5.95S8.78 6.5 12 6.5c1.83 0 3.06.78 3.76 1.45l2.56-2.47C16.64 3.9 14.52 3 12 3 6.98 3 3 6.97 3 12s3.98 9 9 9c5.2 0 8.63-3.65 8.63-8.8 0-.6-.07-1.05-.18-1.5Z"/></svg>
          </div>
          <div class="tile-name">Google</div>
        </a>
        <a class="tile" href="https://www.youtube.com/" style="--c1:#FF4444;--c2:#CC0000">
          <div class="tile-icon">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.6 3.6 12 3.6 12 3.6s-7.6 0-9.4.5A3 3 0 0 0 .5 6.2C0 8 0 12 0 12s0 4 .5 5.8a3 3 0 0 0 2.1 2.1c1.8.5 9.4.5 9.4.5s7.6 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.8.5-5.8.5-5.8s0-4-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg>
          </div>
          <div class="tile-name">YouTube</div>
        </a>
        <a class="tile" href="https://github.com/" style="--c1:#3f3f46;--c2:#18181b">
          <div class="tile-icon">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.9 10.9c.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.6-1.3-1.6-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.3 11.3 0 0 1 6 0C17.7 4 18.7 4.3 18.7 4.3c.7 1.6.3 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"/></svg>
          </div>
          <div class="tile-name">GitHub</div>
        </a>
        <a class="tile" href="https://en.wikipedia.org/" style="--c1:#8a8d91;--c2:#444">
          <div class="tile-icon">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M21.2 5.6V7h-.5c-.4 0-.8.3-1 .8l-4.7 11.8h-.5L11 12.1l-3.4 7.5H7L2.3 7.7c-.2-.5-.5-.8-1-.8h-.5V5.6h5.1V7h-.4c-.7 0-.9.3-.7.8l3.3 8.5 2.3-5.2-1.5-3.5c-.2-.4-.5-.6-.9-.6h-.3V5.6h4.8V7h-.4c-.8 0-.9.3-.7.8l1.3 3.4 1.4-3.3c.3-.6 0-.9-.8-.9h-.3V5.6h4.2V7h-.3c-.5 0-.9.2-1.2.8l-2 4.5 2.5 6.1 3.7-10.3c.2-.6 0-1-.7-1h-.3V5.6h3.8Z"/></svg>
          </div>
          <div class="tile-name">Wikipedia</div>
        </a>
        <a class="tile" href="https://chat.openai.com/" style="--c1:#10a37f;--c2:#0c7e63">
          <div class="tile-icon">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M22.3 10.2a5.8 5.8 0 0 0-.5-4.8 6 6 0 0 0-6.4-2.8 6 6 0 0 0-4.6-2 5.9 5.9 0 0 0-5.6 4A5.9 5.9 0 0 0 1.3 7.6 6 6 0 0 0 2 13.8a5.9 5.9 0 0 0 .5 4.8 6 6 0 0 0 6.4 2.8 5.9 5.9 0 0 0 4.6 2 5.9 5.9 0 0 0 5.6-4 5.9 5.9 0 0 0 3.9-2.9 6 6 0 0 0-.7-6.2ZM13.5 20.3a4.4 4.4 0 0 1-2.8-1l.1-.1 4.7-2.7a.8.8 0 0 0 .4-.7v-6.6l2 1.1v5.6a4.5 4.5 0 0 1-4.4 4.4Zm-9.4-4a4.4 4.4 0 0 1-.5-3l.1.1 4.7 2.7a.8.8 0 0 0 .8 0l5.7-3.3V15l-4.8 2.8a4.4 4.4 0 0 1-6-1.6Zm-1.2-10a4.4 4.4 0 0 1 2.3-2L5.3 4.4v5.4a.8.8 0 0 0 .4.7l5.7 3.3-2 1.1-4.8-2.7a4.4 4.4 0 0 1-1.6-6Zm16.3 3.8L13.5 6.8l2-1.1L20.3 8.5a4.4 4.4 0 0 1-.7 7.9v-5.4a.8.8 0 0 0-.4-.7ZM21.4 8l-.1-.1-4.7-2.7a.8.8 0 0 0-.8 0l-5.7 3.3V6.1l4.8-2.8A4.4 4.4 0 0 1 21.4 8ZM8.9 12.7 7 11.6V6a4.4 4.4 0 0 1 7.2-3.4l-.1.1-4.7 2.7a.8.8 0 0 0-.4.7v6.6Zm1-2.3L12.5 9l2.5 1.4v2.8L12.5 14.6 10 13.2v-2.8Z"/></svg>
          </div>
          <div class="tile-name">ChatGPT</div>
        </a>
        <a class="tile" href="https://x.com/" style="--c1:#0f1115;--c2:#2b2e36">
          <div class="tile-icon">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M18.244 2H21l-6.52 7.45L22 22h-6.828l-4.78-6.24L4.8 22H2.04l6.98-7.97L2 2h6.914l4.36 5.76L18.244 2Zm-1.196 18h1.9L7.02 4H5.04l12.008 16Z"/></svg>
          </div>
          <div class="tile-name">X</div>
        </a>
        <a class="tile" href="https://www.reddit.com/" style="--c1:#FF4500;--c2:#cc3700">
          <div class="tile-icon">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M22 12c0-1.1-.9-2-2-2-.5 0-1 .2-1.4.6A10.5 10.5 0 0 0 13 8.5l1-4.6 3.3.7a1.5 1.5 0 1 0 .2-1L13.5 3l-1.2 5.5A10.5 10.5 0 0 0 5.4 10.6 2 2 0 1 0 4 14.3 4.8 4.8 0 0 0 4 15c0 3.3 3.6 6 8 6s8-2.7 8-6a4.7 4.7 0 0 0 0-.7c1.1-.4 2-1.3 2-2.3ZM8 13.5a1.5 1.5 0 1 1 1.5 1.5A1.5 1.5 0 0 1 8 13.5Zm7.8 4.4a5.6 5.6 0 0 1-3.8 1.1 5.6 5.6 0 0 1-3.8-1.1.6.6 0 1 1 .8-.8 4.4 4.4 0 0 0 3 .9 4.4 4.4 0 0 0 3-.9.6.6 0 0 1 .8.8ZM14.5 15a1.5 1.5 0 1 1 1.5-1.5 1.5 1.5 0 0 1-1.5 1.5Z"/></svg>
          </div>
          <div class="tile-name">Reddit</div>
        </a>
        <a class="tile" href="https://translate.google.com/" style="--c1:#4285F4;--c2:#0b57d0">
          <div class="tile-icon">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12.9 15l-2.6-2.6.03-.03A18 18 0 0 0 14.1 5H17V3h-7V1H8v2H1v2h11.2a16 16 0 0 1-3.3 6.2 15.9 15.9 0 0 1-2.3-3.3H4.6a18 18 0 0 0 3 4.5L4.3 15.6l1.4 1.4L9 13.7l2.1 2.1.8-1Zm5.1-4h-2l-4.5 12h2l1.1-3h4.8l1.1 3h2L18 11Zm-2.6 7 1.6-4.3 1.6 4.3h-3.2Z"/></svg>
          </div>
          <div class="tile-name">Translate</div>
        </a>
      </section>

      <footer class="foot">
        <div class="pill">
          <span class="dot"></span>
          Nova v0.1 · Private · Lightning fast
        </div>
      </footer>
    </main>

    <script src="newtab.js"></script>
  </body>
</html>
