<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova</title>
    <link rel="stylesheet" href="chrome.css" />
  </head>
  <body>
    <header class="chrome">
      <div class="tabs-row">
        <div id="tabs" class="tabs"></div>
        <button id="new-tab" class="icon-btn new-tab" title="New tab (Ctrl+T)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <div class="toolbar">
        <button id="back" class="icon-btn" title="Back (Alt+Left)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button id="forward" class="icon-btn" title="Forward (Alt+Right)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button id="reload" class="icon-btn" title="Reload (Ctrl+R)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
        </button>
        <button id="home" class="icon-btn" title="Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        </button>

        <form id="addr-form" class="addr">
          <svg class="addr-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
          </svg>
          <input id="addr" type="text" spellcheck="false" autocomplete="off" placeholder="Search with Google or enter an address…" />
        </form>

        <button id="menu" class="icon-btn" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>

      <div id="menu-panel" class="menu-panel hidden">
        <button class="menu-item" data-action="new-tab">
          <span>New tab</span><span class="kbd">Ctrl+T</span>
        </button>
        <button class="menu-item" data-action="reload">
          <span>Reload</span><span class="kbd">Ctrl+R</span>
        </button>
        <button class="menu-item" data-action="home">
          <span>Home</span>
        </button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-action="toggle-theme">
          <span>Toggle theme</span>
        </button>
        <button class="menu-item" data-action="about">
          <span>About Nova</span>
        </button>
      </div>
    </header>

    <!-- Tiny diagnostics badge in the bottom-right of the chrome area. If this
         stays stuck on "html only" it means chrome.js never ran. -->
    <div id="diag" class="diag">html</div>

    <script>
      // Inline marker so we can confirm even inline scripts execute.
      (function () {
        var d = document.getElementById("diag");
        if (d) d.textContent = "inline";
      })();
    </script>
    <script src="chrome.js"></script>
  </body>
</html>
