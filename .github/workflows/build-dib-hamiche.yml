name: Build DIB HAMICHE (Electron / Windows .exe)

on:
  push:
    paths:
      - "electron-app/**"
      - ".github/workflows/build-dib-hamiche.yml"
  pull_request:
    paths:
      - "electron-app/**"
      - ".github/workflows/build-dib-hamiche.yml"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build DIB HAMICHE installer + portable (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: electron-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: electron-app/package-lock.json

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        run: npx electron-builder --win --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List artifacts
        shell: pwsh
        run: |
          if (Test-Path dist) { Get-ChildItem dist | Select-Object Name, Length | Format-Table }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DIB-HAMICHE-Setup
          path: electron-app/dist/DIB-HAMICHE-Setup-*.exe
          if-no-files-found: warn

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: DIB-HAMICHE-Portable
          path: electron-app/dist/DIB-HAMICHE-Portable-*.exe
          if-no-files-found: warn
