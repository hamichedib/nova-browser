name: Build Nova (Windows)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  # ── Rust launcher (Firefox-based) ──
  build-rust-launcher:
    name: Build Rust launcher + installer
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher

      - name: Build launcher (release)
        working-directory: launcher
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage Nova.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item launcher\target\x86_64-pc-windows-msvc\release\Nova.exe dist\Nova.exe
          Get-ChildItem dist | Select-Object Name, Length | Format-Table

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $env:Path += ";C:\Program Files (x86)\NSIS"
          & "C:\Program Files (x86)\NSIS\makensis.exe" /NOCD installer\Nova.nsi

      - name: Stage installer
        shell: pwsh
        run: |
          Get-ChildItem dist | Select-Object Name, Length | Format-Table

      - name: Upload Nova.exe
        uses: actions/upload-artifact@v4
        with:
          name: nova-windows-exe
          path: dist/Nova.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: nova-windows-installer
          path: dist/Nova-Setup*.exe
          if-no-files-found: warn

  # ── WPF + CefSharp browser (Chromium-based) ──
  build-wpf-browser:
    name: Build NovaBrowser WPF (CefSharp)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore NuGet packages
        working-directory: NovaBrowser
        run: dotnet restore -r win-x64

      - name: Build NovaBrowser (Release, x64)
        working-directory: NovaBrowser
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o ../dist/NovaBrowser

      - name: List output
        shell: pwsh
        run: |
          Get-ChildItem dist\NovaBrowser -Recurse | Where-Object { -not $_.PSIsContainer } |
            Select-Object FullName, Length | Format-Table -AutoSize

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build NovaBrowser installer
        shell: pwsh
        run: |
          $env:Path += ";C:\Program Files (x86)\NSIS"
          & "C:\Program Files (x86)\NSIS\makensis.exe" /NOCD installer\NovaBrowser.nsi

      - name: List installer
        shell: pwsh
        run: |
          Get-ChildItem dist\NovaBrowser-Setup*.exe | Select-Object Name, Length | Format-Table

      - name: Upload NovaBrowser (portable)
        uses: actions/upload-artifact@v4
        with:
          name: nova-wpf-browser-portable
          path: dist/NovaBrowser/

      - name: Upload NovaBrowser Installer
        uses: actions/upload-artifact@v4
        with:
          name: nova-wpf-browser-installer
          path: dist/NovaBrowser-Setup*.exe
