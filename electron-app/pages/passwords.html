<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Passwords — DIB HAMICHE</title>
<link rel="stylesheet" href="_shared.css" />
</head>
<body>
<div class="header">
    <div class="logo">D</div>
    <div><div class="name">DIB HAMICHE</div><div class="nova">NOVA PRO · PASSWORDS</div></div>
</div>
<div class="page">
    <h1>🔒 <span class="accent">Passwords</span></h1>
    <div class="sub">Local password vault. Entries never leave your computer.</div>

    <div class="card">
        <h3>Add entry</h3>
        <div class="row">
            <div class="col"><label>Site</label><input id="site" placeholder="example.com"></div>
            <div class="col"><label>Username / Email</label><input id="user" placeholder="me@…"></div>
            <div class="col"><label>Password</label><input id="pass" type="password"></div>
            <div><button class="btn" onclick="addEntry()">Save</button></div>
        </div>
        <p class="small">Stored locally in your user profile. Consider using your OS keychain for stronger protection.</p>
    </div>

    <div class="card">
        <table>
            <thead><tr><th>Site</th><th>Username</th><th>Password</th><th>Saved</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
        </table>
    </div>
</div>
<script>
    async function load() {
        const s = await window.dib.store.get();
        const body = document.getElementById('rows');
        if (!s.passwords.length) {
            body.innerHTML = '<tr><td colspan="5" class="small">No saved passwords.</td></tr>';
            return;
        }
        body.innerHTML = s.passwords.map(p => `
            <tr>
              <td>${(p.site||'').replace(/</g,'&lt;')}</td>
              <td>${(p.username||'').replace(/</g,'&lt;')}</td>
              <td>
                <span class="pw" data-p="${encodeURIComponent(p.password||'')}">••••••••</span>
                <button class="btn secondary" data-reveal>Show</button>
              </td>
              <td class="small">${p.savedAt ? new Date(p.savedAt).toLocaleString('fr-DZ') : '—'}</td>
              <td><button class="btn danger" data-rm="${p.id}">Remove</button></td>
            </tr>`).join('');
        body.querySelectorAll('[data-reveal]').forEach(b => b.onclick = (e) => {
            const s = e.target.parentElement.querySelector('.pw');
            if (s.textContent === '••••••••') { s.textContent = decodeURIComponent(s.dataset.p); b.textContent = 'Hide'; }
            else { s.textContent = '••••••••'; b.textContent = 'Show'; }
        });
        body.querySelectorAll('[data-rm]').forEach(b => b.onclick = () =>
            window.dib.passwords.remove(b.dataset.rm).then(load));
    }
    async function addEntry() {
        const site = document.getElementById('site').value.trim();
        const user = document.getElementById('user').value.trim();
        const pw   = document.getElementById('pass').value;
        if (!site || !pw) return;
        await window.dib.passwords.add({
            id: Date.now().toString(36),
            site, username: user, password: pw,
        });
        document.getElementById('site').value = '';
        document.getElementById('user').value = '';
        document.getElementById('pass').value = '';
        load();
    }
    load();
</script>
</body>
</html>
