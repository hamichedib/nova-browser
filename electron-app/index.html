<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: dib: file: https: http:;" />
    <title>DIB HAMICHE</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-nova-dark">
<div class="app">
    <!-- ================ TITLE BAR ================ -->
    <header class="titlebar">
        <div class="brand">
            <div class="logo">D</div>
            <div class="brand-text">
                <span class="brand-main">DIB HAMICHE</span>
                <span class="brand-sub">NOVA PRO</span>
            </div>
        </div>

        <div class="tabs-wrap">
            <div class="tabs-strip" id="tabsStrip"></div>
            <button class="add-tab" id="btnAddTab" title="New tab">+</button>
        </div>

        <div class="titlebar-meta">
            <div class="clock-wrap" title="Algeria time">
                <span class="clock" id="liveClock">00:00:00</span>
                <span class="date" id="liveDate">--/--/----</span>
            </div>
            <div class="win-ctrls">
                <button class="win-btn" id="btnMin" title="Minimize">&#x2013;</button>
                <button class="win-btn" id="btnMax" title="Maximize / Restore">&#x25A1;</button>
                <button class="win-btn" id="btnFull" title="Fullscreen (F11)">&#x26F6;</button>
                <button class="win-btn win-close" id="btnClose" title="Close">&#x2715;</button>
            </div>
        </div>
    </header>

    <!-- ================ TOOLBAR ================ -->
    <div class="toolbar">
        <button class="tbtn" id="btnBack" title="Back">&#x2190;</button>
        <button class="tbtn" id="btnForward" title="Forward">&#x2192;</button>
        <button class="tbtn" id="btnReload" title="Reload">&#x21BB;</button>
        <button class="tbtn" id="btnHome" title="Home">&#x2302;</button>

        <div class="omnibox">
            <select id="searchEngine" class="engine-select" title="Search engine">
                <option value="google">Google</option>
                <option value="bing">Bing</option>
                <option value="duckduckgo">DuckDuckGo</option>
                <option value="brave">Brave</option>
                <option value="yandex">Yandex</option>
                <option value="startpage">Startpage</option>
                <option value="ecosia">Ecosia</option>
            </select>
            <input id="urlInput" type="text"
                   placeholder="Search Google or type a URL  |  Rechercher ou saisir une URL"
                   autocomplete="off" spellcheck="false" />
            <button id="btnGo" class="go-btn" title="Go">&#x27A4;</button>
            <button id="btnBookmark" class="tbtn bookmark" title="Bookmark this page">&#x2606;</button>
        </div>

        <button class="tbtn highlight" id="btnGLM" title="GLM 5.1 (ChatGLM)">GLM 5.1</button>
        <button class="tbtn" id="btnYouTube" title="YouTube">YouTube</button>
        <button class="tbtn" id="btnGoogleLogin"
                title="Open Google sign-in in your system browser (Google blocks sign-in inside embedded browsers).">
            Google Login ⎋
        </button>
        <button class="tbtn" id="btnOpenExternal" title="Open current page in your system browser">Open externally ⎋</button>

        <div class="menu-wrap">
            <button class="tbtn menu-btn" id="btnMenu" title="Menu">&#x22EE;</button>
            <div class="menu" id="menuPopup" hidden>
                <button data-goto="dib://newtab">New Tab Home</button>
                <button data-goto="dib://bookmarks">Bookmarks</button>
                <button data-goto="dib://history">History</button>
                <button data-goto="dib://downloads">Downloads</button>
                <button data-goto="dib://passwords">Passwords</button>
                <button data-goto="dib://languages">Languages</button>
                <button data-goto="dib://updates">Updates</button>
                <button data-goto="dib://settings">Settings</button>
                <button data-goto="dib://about">About DIB HAMICHE</button>
            </div>
        </div>
    </div>

    <!-- ================ VIEWPORT ================ -->
    <main class="viewport" id="viewport"></main>

    <!-- ================ STATUS BAR ================ -->
    <footer class="statusbar">
        <span class="status-brand">DIB HAMICHE &mdash; NOVA PRO &middot; v<span id="verLabel">1.0.0</span></span>
        <span class="status-url" id="statusUrl">dib://newtab</span>
        <span class="status-clock" id="statusClock">Algiers &middot; 00:00:00</span>
    </footer>
</div>

<script src="renderer.js"></script>
</body>
</html>
